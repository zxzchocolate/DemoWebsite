name: Build Xox APK
on:
  push:
    paths:
      - 'Xox/**'
      - '.github/workflows/xox-android.yml'
  pull_request:
    paths:
      - 'Xox/**'
      - '.github/workflows/xox-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: Xox
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Xox-debug-apk
          path: Xox/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
